name: Capability request
description: Something you want the writers' room to do that you don't know how to build
title: "Capability: "
labels: ["proposal"]
body:
  - type: dropdown
    id: layer
    attributes:
      label: Which layer? (see docs/MODEL.md)
      options: [record, rules, work, characters, memory, showrunner, production, participation, deploy, not sure]
    validations: { required: true }
  - type: textarea
    id: want
    attributes: { label: What do you want to be able to do? }
    validations: { required: true }
  - type: textarea
    id: why
    attributes: { label: Why does it matter? }
  - type: textarea
    id: done
    attributes: { label: Done when… }
  - type: input
    id: from
    attributes: { label: How should we credit you?, placeholder: "a name, a handle, anonymous, or <agent> for <person>" }
