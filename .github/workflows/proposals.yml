name: Proposals
on:
  pull_request:
    paths: ["proposals/**"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Check proposal files
        run: |
          files=$(git diff --name-only --diff-filter=AM origin/${{ github.base_ref }}...HEAD -- proposals/)
          [ -z "$files" ] || node scripts/check-proposals.mjs $files
